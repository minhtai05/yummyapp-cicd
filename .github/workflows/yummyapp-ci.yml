name: YummyApp Mobile Backend CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-test-job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: 4. Static Code Analysis (Linter)
        run: |
          python -m flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: 5. Execute Tests & Quality Gate
        run: |
          python -m coverage run --source=yummy_app,gps_service -m unittest discover -s . -p "test_*.py" -v
          python -m coverage report -m --precision=2
          python -m coverage html -d coverage_html
          python -m coverage report --precision=2 --fail-under=80

      - name: 6. Upload HTML Coverage Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YummyApp-Coverage-Report
          path: coverage_html/
          retention-days: 7
          if-no-files-found: warn
